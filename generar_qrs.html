<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de QR · PS2 GamePass</title>
<style>
  body{font-family:system-ui,sans-serif; background:#0e0f1a; color:#eef0f7; padding:30px; text-align:center;}
  h1{margin-bottom:6px;}
  p.sub{color:#9aa0b4; margin-top:0;}
  input{padding:10px; width:340px; max-width:80vw; border-radius:8px; border:1px solid #444; background:#161826; color:#fff; margin-bottom:24px;}
  .status{color:#9aa0b4; font-size:.82rem; margin-bottom:10px;}
  .status.error{color:#ff6b6b;}
  .cards{display:flex; gap:24px; flex-wrap:wrap; justify-content:center;}
  .card{background:#1c1f30; border-radius:14px; padding:20px; width:220px; box-shadow:0 8px 20px #0006;}
  .card img{width:180px; height:180px; background:#fff; border-radius:8px;}
  .card h3{margin:12px 0 2px;}
  .card .subtitulo{color:#9aa0b4; font-size:.8rem; margin:0 0 6px;}
  .card .plataforma-tag{color:#5ee7c8; font-size:.72rem; font-weight:700; letter-spacing:.3px; margin:0 0 10px; text-transform:uppercase;}
  .card a{color:#5ee7c8; font-size:.75rem; word-break:break-all;}
  .card button{margin-top:10px; background:#7c5cff; border:none; color:#fff; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600;}
</style>
</head>
<body>
  <h1>🎮 QR por disco</h1>
  <p class="sub">Pegá la URL base donde publicaste el sitio (GitHub Pages) y se genera un QR por cada disco cargado en la base. Imprimilo y pegalo en la funda del disco físico.</p>
  <input id="baseUrl" placeholder="https://tuusuario.github.io/tu-repo/index.html" value="">
  <p class="status" id="statusMsg">Cargando discos...</p>
  <div class="cards" id="cards"></div>

<script src="supabase-config.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// Mismas etiquetas de plataforma que usa el sitio principal (script.js),
// así el texto que aparece abajo de cada QR coincide con el de la web.
const PLATFORMS = {
  ps2:       { label: "PlayStation 2" },
  ps1:       { label: "PlayStation 1" },
  ps3:       { label: "PlayStation 3" },
  psp:       { label: "PSP" },
  xbox:      { label: "Xbox" },
  xbox360:   { label: "Xbox 360" },
  gamecube:  { label: "GameCube" },
  wii:       { label: "Wii" },
  n64:       { label: "Nintendo 64" },
  snes:      { label: "Super Nintendo" },
  nes:       { label: "Nintendo (NES)" },
  gba:       { label: "Game Boy Advance" },
  switch:    { label: "Nintendo Switch" },
  dreamcast: { label: "Dreamcast" },
  megadrive: { label: "Mega Drive / Genesis" },
  pc:        { label: "PC" },
  otro:      { label: "Otra" },
};

let DISCOS = [];
const statusEl = document.getElementById("statusMsg");
const cardsEl = document.getElementById("cards");
const inputEl = document.getElementById("baseUrl");

function platformLabel(discoPlataforma) {
  return (discoPlataforma && PLATFORMS[discoPlataforma]) ? PLATFORMS[discoPlataforma].label : "PlayStation 2";
}

function baseUrl() {
  return inputEl.value.trim() || (location.origin + location.pathname.replace("generar_qrs.html", "index.html"));
}

function render() {
  const base = baseUrl();
  cardsEl.innerHTML = "";
  DISCOS.forEach(d => {
    const url = `${base}?disco=${d.id}`;
    const qrImg = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}`;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${qrImg}" alt="QR ${d.nombre}">
      <h3>${d.nombre}</h3>
      ${d.subtitulo ? `<p class="subtitulo">${d.subtitulo}</p>` : ""}
      <p class="plataforma-tag">${platformLabel(d.plataforma)} / ${d.nombre}</p>
      <a href="${url}" target="_blank">${url}</a><br>
      <button onclick="window.open('${qrImg}','_blank')">Descargar QR</button>
    `;
    cardsEl.appendChild(card);
  });
}

async function loadDiscos() {
  if (!window.supabaseConfig || !window.supabaseConfig.url || window.supabaseConfig.url.startsWith("PEGA_ACA")) {
    statusEl.textContent = "⚠️ Falta configurar supabase-config.js — no se pueden leer los discos.";
    statusEl.classList.add("error");
    return;
  }
  try {
    const sb = createClient(window.supabaseConfig.url, window.supabaseConfig.anonKey);
    const { data, error } = await sb.from("discos").select("*").order("id");
    if (error) throw error;
    DISCOS = data || [];
    if (!DISCOS.length) {
      statusEl.textContent = "No hay discos cargados todavía en la base.";
      return;
    }
    statusEl.textContent = `${DISCOS.length} disco${DISCOS.length === 1 ? "" : "s"} encontrado${DISCOS.length === 1 ? "" : "s"}.`;
    render();
  } catch (err) {
    console.error(err);
    statusEl.textContent = "⚠️ No se pudieron cargar los discos desde Supabase.";
    statusEl.classList.add("error");
  }
}

// Se regenera al tipear (cambia la URL codificada en cada QR al instante).
inputEl.addEventListener("input", render);
loadDiscos();
</script>
</body>
</html>

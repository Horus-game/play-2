<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS2 GamePass · Guardia de Discos</title>
<style>
  :root{
    --bg:#0e0f1a; --bg2:#161826; --card:#1c1f30; --card2:#232640;
    --accent:#5ee7c8; --accent2:#7c5cff; --text:#eef0f7; --muted:#9aa0b4;
    --danger:#ff6b6b; --radius:16px; --shadow:0 8px 24px rgba(0,0,0,.35);
    --d1:#e63946; --d3:#1d3557; --dc:#2a9d8f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:
    radial-gradient(1200px 600px at 10% -10%, #23264a55, transparent),
    radial-gradient(1000px 500px at 110% 10%, #5ee7c822, transparent),
    var(--bg); color:var(--text); min-height:100vh; padding-bottom:60px;}
  header{position:sticky; top:0; z-index:50; backdrop-filter:blur(10px); background:#0e0f1acc; border-bottom:1px solid #ffffff12; padding:14px 20px;}
  .header-inner{max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.25rem; letter-spacing:.5px;}
  .logo span.tag{background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .disc-tabs{display:flex; gap:8px; flex-wrap:wrap;}
  .disc-tab{padding:8px 16px; border-radius:999px; border:1px solid #ffffff20; background:#ffffff08; color:var(--muted); cursor:pointer; font-size:.85rem; font-weight:600; transition:.2s;}
  .disc-tab:hover{background:#ffffff14; color:var(--text);}
  .disc-tab.active{color:#0e0f1a; border-color:transparent;}
  main{max-width:1200px; margin:0 auto; padding:20px;}
  .disc-banner{border-radius:var(--radius); padding:22px 26px; margin-bottom:20px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
  .disc-banner h1{margin:0 0 4px; font-size:1.6rem;}
  .disc-banner p{margin:0; opacity:.85}
  .disc-banner .count{position:absolute; right:20px; top:50%; transform:translateY(-50%); font-size:2.6rem; font-weight:900; opacity:.25;}
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; background:var(--bg2); padding:14px; border-radius:var(--radius); border:1px solid #ffffff10;}
  .toolbar input[type=search]{flex:1; min-width:180px; background:#0e0f1a; border:1px solid #ffffff20; color:var(--text); padding:10px 14px; border-radius:10px; font-size:.9rem;}
  .toolbar select{background:#0e0f1a; border:1px solid #ffffff20; color:var(--text); padding:10px 12px; border-radius:10px; font-size:.85rem; cursor:pointer;}
  .toolbar label{font-size:.75rem; color:var(--muted); display:flex; flex-direction:column; gap:4px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .chip{padding:6px 14px; border-radius:999px; background:#ffffff08; border:1px solid #ffffff18; font-size:.78rem; cursor:pointer; color:var(--muted); transition:.15s;}
  .chip:hover{background:#ffffff14;}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0e0f1a; font-weight:700; border-color:transparent;}
  .stats{color:var(--muted); font-size:.8rem; margin-bottom:14px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:16px;}
  .gcard{background:var(--card); border-radius:14px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow); border:1px solid #ffffff0d; transition:.2s; display:flex; flex-direction:column;}
  .gcard:hover{transform:translateY(-4px); border-color:var(--accent);}
  .cover-wrap{position:relative; width:100%; aspect-ratio:3/4; background:linear-gradient(135deg,#2a2d4a,#1c1f30); overflow:hidden;}
  .cover-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .cover-fallback{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:10px; font-weight:800; font-size:1rem; color:#fff8;}
  .badge-cat{position:absolute; top:8px; left:8px; background:#000a; padding:3px 9px; border-radius:999px; font-size:.65rem; font-weight:700; letter-spacing:.3px;}
  .gcard-body{padding:10px 12px 12px; flex:1; display:flex; flex-direction:column; gap:6px;}
  .gcard-title{font-size:.85rem; font-weight:700; line-height:1.25; min-height:2.2em;}
  .gcard-meta{display:flex; justify-content:space-between; align-items:center; font-size:.72rem; color:var(--muted);}
  .stars{color:#ffce54; letter-spacing:1px;}
  .empty{text-align:center; padding:60px 20px; color:var(--muted);}
  .empty h3{color:var(--text);}
  /* Modal */
  .modal-overlay{position:fixed; inset:0; background:#000c; backdrop-filter:blur(4px); z-index:100; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:30px 16px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--bg2); max-width:780px; width:100%; border-radius:20px; overflow:hidden; box-shadow:0 20px 60px #000a; border:1px solid #ffffff14; animation:pop .2s ease;}
  @keyframes pop{from{transform:scale(.96); opacity:0} to{transform:scale(1); opacity:1}}
  .modal-top{display:flex; gap:20px; padding:24px; flex-wrap:wrap;}
  .modal-cover{width:200px; flex-shrink:0; border-radius:12px; overflow:hidden; aspect-ratio:3/4; background:#11131f;}
  .modal-cover img{width:100%; height:100%; object-fit:cover;}
  .modal-info{flex:1; min-width:220px;}
  .modal-info h2{margin:0 0 6px; font-size:1.4rem;}
  .modal-tags{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .tag{background:#ffffff10; padding:4px 10px; border-radius:8px; font-size:.72rem; color:var(--accent); font-weight:700;}
  .modal-info p.resena{color:#d0d3e2; font-size:.9rem; line-height:1.5;}
  .modal-stat-row{display:flex; gap:20px; margin-top:14px; flex-wrap:wrap;}
  .modal-stat{font-size:.78rem; color:var(--muted);}
  .modal-stat b{display:block; color:var(--text); font-size:.95rem;}
  .shots{display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:0 24px 24px;}
  .shots img{width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:8px; background:#11131f;}
  .close-btn{position:absolute; top:16px; right:16px; background:#ffffff14; border:none; color:#fff; width:34px; height:34px; border-radius:50%; font-size:1.1rem; cursor:pointer;}
  .modal{position:relative;}
  footer{text-align:center; color:var(--muted); font-size:.75rem; padding:30px 20px 10px;}
  @media (max-width:600px){ .disc-banner .count{display:none;} }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">🎮 PS2<span class="tag">GamePass</span></div>
    <nav class="disc-tabs" id="discTabs"></nav>
  </div>
</header>

<main>
  <div class="disc-banner" id="discBanner"></div>

  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Buscar juego...">
    <label>Ordenar
      <select id="sortSelect">
        <option value="alpha">A - Z</option>
        <option value="alpha-desc">Z - A</option>
        <option value="dificultad-asc">Dificultad ↑</option>
        <option value="dificultad-desc">Dificultad ↓</option>
        <option value="jugadores">Cant. Jugadores</option>
      </select>
    </label>
  </div>

  <div class="chips" id="categoryChips"></div>
  <div class="stats" id="statsLine"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <h3>Sin resultados</h3>
    <p>Probá con otra búsqueda o categoría.</p>
  </div>
</main>

<footer>Catálogo generado automáticamente · PS2 Fat + Adaptador de Red · Guardá este HTML en GitHub Pages</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" id="closeModal">✕</button>
    <div class="modal-top">
      <div class="modal-cover"><img id="modalCoverImg" alt=""></div>
      <div class="modal-info">
        <h2 id="modalTitle"></h2>
        <div class="modal-tags">
          <span class="tag" id="modalCat"></span>
          <span class="tag" id="modalDisc"></span>
        </div>
        <p class="resena" id="modalResena"></p>
        <div class="modal-stat-row">
          <div class="modal-stat">Dificultad<b id="modalDificultad"></b></div>
          <div class="modal-stat">Jugadores<b id="modalJugadores"></b></div>
          <div class="modal-stat">Género<b id="modalGenero"></b></div>
        </div>
      </div>
    </div>
    <div class="shots">
      <img id="shot1" alt="Captura 1" loading="lazy">
      <img id="shot2" alt="Captura 2" loading="lazy">
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
